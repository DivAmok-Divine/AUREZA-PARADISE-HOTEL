<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#D4AF37">
    <title>AUREZA PARADISE HOTEL | Your perfect getaway in Tamale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
    <div class="container" style="position: relative;">
        <!-- TOGGLE THEME - Now scolls away with content -->
        <button id="theme-toggle" class="theme-toggle-btn">
            <svg id="sun-icon" viewBox="0 0 24 24" style="display:none;">
                <circle cx="12" cy="12" r="5" />
                <path
                    d="M12 1v2m0 18v2M4.2 4.2l1.4 1.4m12.8 12.8l1.4 1.4M1 12h2m18 0h2M4.2 19.8l1.4-1.4m12.8-12.8l1.4-1.4" />
            </svg>
            <svg id="moon-icon" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
            </svg>
        </button>

        <!-- Components inject here instantly -->
        <div id="header-placeholder"></div>
        <div id="services-placeholder"></div>
        <div id="contact-placeholder"></div>
        <div id="location-placeholder"></div>
        <div id="email-placeholder"></div>
        <div id="footer-placeholder"></div>
    </div>

    <!-- LUXURY GALLERY MODAL -->
    <div id="gallery-modal" class="gallery-modal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div id="slider-container" class="slider-container">
                <!-- Mini Next Preview (Top Right) -->
                <div id="next-preview" class="next-preview"></div>
                <!-- Muted Stealth Triggers (Thin SVG Arrows) -->
                <button class="nav-btn prev-btn"><svg viewBox="0 0 24 24">
                        <path d="M15 18l-6-6 6-6" />
                    </svg></button>
                <button class="nav-btn next-btn"><svg viewBox="0 0 24 24">
                        <path d="M9 18l6-6-6-6" />
                    </svg></button>
            </div>

            <!-- ALL-IMAGE GRID OVERLAY -->
            <div id="grid-overlay" class="grid-overlay">
                <div class="grid-header">
                    <div class="title-stack">
                        <span class="grid-title">Gallery Collections</span>
                        <div class="header-divider"></div>
                        <span id="grid-service-name" class="service-name-subtitle"></span>
                    </div>
                    <button id="close-grid" class="close-grid">&times;</button>
                </div>
                <div id="grid-content" class="grid-content"></div>
            </div>
            <!-- Dynamic Dots Inject Here -->
            <div id="slider-dots" class="slider-dots"></div>
            <a href="#contact-us" id="book-now-gallery" class="book-floating-btn">Book Now</a>
        </div>
    </div>

    <script>
        // 🌓 SMART THEME ENGINE
        const toggleBtn = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

        const getPreferredTheme = () => {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            return systemDark.matches ? 'dark' : 'light';
        };

        const setTheme = (t) => {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            sunIcon.style.display = t === 'dark' ? 'block' : 'none';
            moonIcon.style.display = t === 'dark' ? 'none' : 'block';
        };

        setTheme(getPreferredTheme());
        systemDark.addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) setTheme(e.matches ? 'dark' : 'light');
        });

        toggleBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        // 🏗️ COMPONENT LOADER
        const renderComponent = (id, html) => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = html;
        };

        const galleryData = {
            accommodation: ['assets/img/roomside_1.jpeg', 'assets/img/roomside_2.jpeg', 'assets/img/roomside_3.jpeg'],
            conferences: ['assets/img/mainfront.jpeg', 'assets/img/reception.jpeg'],
            restaurant: ['assets/img/reception.jpeg', 'assets/img/mainfront.jpeg'],
            pools: ['assets/img/mainfront.jpeg', 'assets/img/reception.jpeg', 'assets/img/mainfront.jpeg', 'assets/img/reception.jpeg', 'assets/img/mainfront.jpeg', 'assets/img/reception.jpeg'],
            laundry: ['assets/img/mainfront.jpeg', 'assets/img/reception.jpeg'],
            gardens: ['assets/img/compound_2.jpeg', 'assets/img/compound_1.jpeg'],
            parking: ['assets/img/frontview_1.jpeg', 'assets/img/mainfront.jpeg']
        };

        renderComponent('header-placeholder', `<header class="header-section"><img src="assets/img/logo.jpg" alt="Logo" class="logo"><div class="welcome-content"><h1>AUREZA PARADISE HOTEL</h1><p class="welcome-text">Your perfect getaway in Tamale</p></div></header>`);

        renderComponent('services-placeholder', `
            <section class="section">
                <h2 class="section-title">Our Services</h2>
                <div class="services-list">
                    <!-- Row 1 -->
                    <div class="service-item" data-service="accommodation">
                        <span class="service-item-text">Accommodation</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
                    </div>
                    <div class="service-item" data-service="conferences">
                        <span class="service-item-text">Conferences</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
                    </div>

                    <!-- Row 2 -->
                    <div class="service-item" data-service="restaurant">
                        <span class="service-item-text">Restaurant</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M8 8v12M16 8v12"/><path d="M3 8h18"/><circle cx="10" cy="4" r="1"/><circle cx="14" cy="4" r="1"/></svg></div>
                    </div>
                    <div class="service-item" data-service="pools">
                        <span class="service-item-text">Swimming Pools</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24"><path d="M2 12c2-2 6-2 8 0s6 2 8 0M2 16c2-2 6-2 8 0s6 2 8 0M2 20c2-2 6-2 8 0s6 2 8 0"/><rect x="2" y="8" width="20" height="14" rx="2" fill="none"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></svg></div>
                    </div>

                    <!-- Row 3 -->
                    <div class="service-item" data-service="laundry">
                        <span class="service-item-text">Laundry</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24"><path d="M12 2v5M7 7h10v12H7V7z"/><path d="M9 7c0-1.1.9-2 2-2h2c1.1 0 2 .9 2 2"/><path d="M7 19v-8h10v8"/><circle cx="10" cy="15" r="1"/><circle cx="14" cy="15" r="1"/></svg></div>
                    </div>
                    <div class="service-item" data-service="gardens">
                        <span class="service-item-text">Serene Gardens</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24"><path d="M12 20V8M12 8c-2-2-5-2-7 0v12c2-2 5-2 7 0M12 8c2-2 5-2 7 0v12c-2-2-5-2-7 0"/><path d="M7 8c-1.5 0-3 1.5-3 3s1.5 3 3 3M17 8c1.5 0 3 1.5 3 3s-1.5 3-3 3"/></svg></div>
                    </div>

                    <!-- Row 4 -->
                    <div class="service-item full-width" data-service="parking">
                        <span class="service-item-text">Parking Space</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24"><path d="M5 17h14v-2H5v2z"/><path d="M7 15v-5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v5"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>
                    </div>
                </div>
            </section>
        `);

        renderComponent('contact-placeholder', `<section class="section" id="contact-us"><h2 class="section-title">Contact Us</h2><div class="contact-section"><div class="contact-info"><div class="contact-item"><span class="contact-label">Phone 1:</span><span class="contact-value">+233 200 011 196</span><a href="tel:+233200011196" class="action-btn call-btn">Call</a></div><div class="contact-item"><span class="contact-label">Phone 2:</span><span class="contact-value">+233 547 795 690</span><a href="tel:+233547795690" class="action-btn call-btn">Call</a></div></div></div></section>`);
        renderComponent('location-placeholder', `<section class="section"><h2 class="section-title">Location</h2><div class="location-section"><div class="location-details"><div class="location-item"><strong>Address:</strong> Malshegu, Tamale</div><div class="location-item"><strong>Digital Address:</strong> NS-522-8759</div><a href="https://www.google.com/maps/search/?api=1&query=9.491158694435885,-0.8808967835476006" class="action-btn" target="_blank" style="margin-top: 15px;">Get Directions</a></div><div class="location-map"><iframe src="https://maps.google.com/maps?q=9.491158694435885,-0.8808967835476006&t=&z=15&ie=UTF8&iwloc=&output=embed" allowfullscreen="" loading="lazy"></iframe></div></div></section>`);
        renderComponent('email-placeholder', `<section class="section"><h2 class="section-title">Email Us</h2><div class="email-section"><p class="email-text">Have a question or want to make a reservation? Send us an email and we'll get back to you as soon as possible.</p><a href="mailto:aurezaparadisehotel@yahoo.com" class="email-link">Send Email</a></div></section>`);
        renderComponent('footer-placeholder', `<footer class="footer"><div class="footer-text">© 2025 Aureza Paradise Hotel. All rights reserved.</div><div class="footer-design">Design By: DivAmok Corp.</div></footer>`);

        // 🖼️ MASTER GALLERY ENGINE + GRID SELECTOR
        const modal = document.getElementById('gallery-modal');
        const sliderContainer = document.getElementById('slider-container');
        const dotsContainer = document.getElementById('slider-dots');
        const nextPreview = document.getElementById('next-preview');
        const gridOverlay = document.getElementById('grid-overlay');
        const gridContent = document.getElementById('grid-content');
        const closeGrid = document.getElementById('close-grid');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        const closeBtn = document.querySelector('.close-modal');
        const bookBtn = document.getElementById('book-now-gallery');

        let currentImages = [];
        let currentIndex = 0;
        let touchStartX = 0, touchEndX = 0;

        const serviceNames = {
            accommodation: "Accommodation",
            conferences: "Conferences",
            restaurant: "Restaurant",
            pools: "Swimming Pools",
            laundry: "Laundry",
            gardens: "Serene Gardens",
            parking: "Parking Space"
        };

        const openGallery = (type) => {
            currentImages = galleryData[type] || [];
            if (currentImages.length === 0) return;

            // 🔥 Reset states for a fresh start
            currentIndex = 0;
            gridOverlay.classList.remove('active'); // Close the collection if it was open
            gridContent.innerHTML = ''; // Clear previous collection images

            // Update the header with the specific service name
            const serviceLabel = document.getElementById('grid-service-name');
            if (serviceLabel) serviceLabel.textContent = serviceNames[type] || type;

            const imgHtml = currentImages.map((src, i) => `<img src="${src}" class="slider-img ${i === 0 ? 'active' : ''}">`).join('');
            const oldImgs = sliderContainer.querySelectorAll('.slider-img');
            oldImgs.forEach(img => img.remove());
            sliderContainer.insertAdjacentHTML('afterbegin', imgHtml);

            dotsContainer.innerHTML = currentImages.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`).join('');
            updateSlider(0);
            modal.classList.add('active');
        };

        const updateSlider = (index) => {
            const imgs = document.querySelectorAll('.slider-img');
            const dots = document.querySelectorAll('.dot');
            imgs.forEach((img, i) => img.classList.toggle('active', i === index));
            dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
            if (currentImages.length > 1) {
                const nextIdx = (index + 1) % currentImages.length;
                nextPreview.style.backgroundImage = `url('${currentImages[nextIdx]}')`;
                nextPreview.style.display = 'block';
            } else {
                nextPreview.style.display = 'none';
            }
        };

        const openGrid = () => {
            gridContent.innerHTML = currentImages.map((src, i) => `
                <div class="grid-thumb" data-index="${i}" style="background-image: url('${src}')"></div>
            `).join('');
            gridOverlay.classList.add('active');
        };

        document.addEventListener('click', (e) => {
            const item = e.target.closest('.service-item');
            if (item) openGallery(item.getAttribute('data-service'));

            const thumb = e.target.closest('.grid-thumb');
            if (thumb) {
                currentIndex = parseInt(thumb.getAttribute('data-index'));
                updateSlider(currentIndex);
                gridOverlay.classList.remove('active');
            }
        });

        nextPreview.addEventListener('click', (e) => { e.stopPropagation(); openGrid(); });
        closeGrid.addEventListener('click', () => gridOverlay.classList.remove('active'));
        nextBtn.addEventListener('click', () => { currentIndex = (currentIndex + 1) % currentImages.length; updateSlider(currentIndex); });
        prevBtn.addEventListener('click', () => { currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length; updateSlider(currentIndex); });
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));
        bookBtn.addEventListener('click', () => { modal.classList.remove('active'); window.location.hash = 'contact-placeholder'; });
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

        sliderContainer.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, { passive: true });
        sliderContainer.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; const dist = touchEndX - touchStartX; if (Math.abs(dist) > 50) { if (dist > 0) currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length; else currentIndex = (currentIndex + 1) % currentImages.length; updateSlider(currentIndex); } }, { passive: true });
        dotsContainer.addEventListener('click', (e) => { const dot = e.target.closest('.dot'); if (dot) { currentIndex = parseInt(dot.getAttribute('data-index')); updateSlider(currentIndex); } });
    </script>
</body>

</html>
