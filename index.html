<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta property="og:description" content="Experience serenity and luxury in the heart of Tamale. Book your stay now.">
    <meta property="og:image" content="assets/img/logo.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">

    <meta name="theme-color" content="#D4AF37">
    <title>AUREZA PARADISE HOTEL | Your perfect getaway in Tamale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <div class="container">
        <!-- Components inject here instantly -->
        <div id="header-placeholder"></div>
        <div id="services-placeholder"></div>
        <div id="contact-placeholder"></div>
        <div id="location-placeholder"></div>
        <div id="email-placeholder"></div>
        <div id="footer-placeholder"></div>
    </div>

    <!-- STABLE COMPONENT LOADER -->
    <script>
        const renderComponent = (id, html) => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = html;
        };

        // Header Component
        renderComponent('header-placeholder', `
            <header class="header-section">
                <img src="assets/img/logo.jpg" alt="Logo" class="logo">
                <div class="welcome-content">
                    <h1>AUREZA PARADISE HOTEL</h1>
                    <p class="welcome-text">Your perfect getaway in Tamale</p>
                </div>
            </header>
        `);

        // Services Component (Stable 2-Column Order)
        renderComponent('services-placeholder', `
            <section class="section">
                <h2 class="section-title">Our Services</h2>
                <div class="services-list">
                    <div class="service-item">
                        <span class="service-item-text">Accommodation</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
                    </div>
                    <div class="service-item">
                        <span class="service-item-text">Conferences</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
                    </div>
                    <div class="service-item">
                        <span class="service-item-text">Restaurant</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M8 8v12M16 8v12"/><path d="M3 8h18"/><circle cx="10" cy="4" r="1"/><circle cx="14" cy="4" r="1"/></svg></div>
                    </div>
                    <div class="service-item">
                        <span class="service-item-text">Swimming Pools</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12c2-2 6-2 8 0s6 2 8 0M2 16c2-2 6-2 8 0s6 2 8 0M2 20c2-2 6-2 8 0s6 2 8 0"/><rect x="2" y="8" width="20" height="14" rx="2" fill="none"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></svg></div>
                    </div>
                    <div class="service-item">
                        <span class="service-item-text">Laundry</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v5M7 7h10v12H7V7z"/><path d="M9 7c0-1.1.9-2 2-2h2c1.1 0 2 .9 2 2"/><path d="M7 19v-8h10v8"/><circle cx="10" cy="15" r="1"/><circle cx="14" cy="15" r="1"/></svg></div>
                    </div>
                    <div class="service-item">
                        <span class="service-item-text">Serene Gardens</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V8M12 8c-2-2-5-2-7 0v12c2-2 5-2 7 0M12 8c2-2 5-2 7 0v12c-2-2-5-2-7 0"/><path d="M7 8c-1.5 0-3 1.5-3 3s1.5 3 3 3M17 8c1.5 0 3 1.5 3 3s-1.5 3-3 3"/></svg></div>
                    </div>
                    <div class="service-item full-width">
                        <span class="service-item-text">Parking Space</span>
                        <div class="service-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14v-2H5v2z"/><path d="M7 15v-5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v5"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>
                    </div>
                </div>
            </section>
        `);

        // Contact Component
        renderComponent('contact-placeholder', `
            <section class="section">
                <h2 class="section-title">Contact Us</h2>
                <div class="contact-section">
                    <div class="contact-info">
                        <div class="contact-item">
                            <span class="contact-label">Phone 1:</span>
                            <span class="contact-value">+233 200 011 196</span>
                            <a href="tel:+233200011196" class="action-btn call-btn">Call</a>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Phone 2:</span>
                            <span class="contact-value">+233 547 795 690</span>
                            <a href="tel:+233547795690" class="action-btn call-btn">Call</a>
                        </div>
                    </div>
                </div>
            </section>
        `);

        // Location Component
        renderComponent('location-placeholder', `
            <section class="section">
                <h2 class="section-title">Location</h2>
                <div class="location-section">
                    <div class="location-details">
                        <div class="location-item"><strong>Address:</strong> Malshegu, Tamale</div>
                        <div class="location-item"><strong>Digital Address:</strong> NS-522-8759</div>
                        <a href="https://www.google.com/maps/search/?api=1&query=9.491158694435885,-0.8808967835476006" class="action-btn" target="_blank" style="margin-top: 15px;">Get Directions</a>
                    </div>
                    <div class="location-map">
                        <iframe src="https://maps.google.com/maps?q=9.491158694435885,-0.8808967835476006&t=&z=15&ie=UTF8&iwloc=&output=embed" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                </div>
            </section>
        `);

        // Email Component
        renderComponent('email-placeholder', `
            <section class="section">
                <h2 class="section-title">Email Us</h2>
                <div class="email-section">
                    <p class="email-text">Have a question or want to make a reservation? Send us an email and we'll get back to you as soon as possible.</p>
                    <a href="mailto:aurezaparadisehotel@yahoo.com" class="email-link">Send Email</a>
                </div>
            </section>
        `);

        // Footer Component
        renderComponent('footer-placeholder', `
            <footer class="footer">
                <div class="footer-text">© 2025 Aureza Paradise Hotel. All rights reserved.</div>
                <div class="footer-design">Design By: DivAmok Corp.</div>
            </footer>
        `);
    </script>
</body>
</html>
